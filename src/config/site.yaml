site:
  name: 宏翔商道
  shortName: 企业导航
  logo: /images/logos/elexvx.png
  url: https://nav.elexvx.com
  description: 汇聚企业内部系统、政务服务、知识产权、企业信用、人工智能与公众平台入口，帮助团队一站直达常用服务。
  language: zh-CN
  locale: zh_CN
  author: 信息研发部
  copyright: 宏翔商道
  icp: 苏ICP备2025160017号

seo:
  defaultTitle: 宏翔商道企业服务导航｜企业系统与政务服务入口
  titleTemplate: "%s｜宏翔商道企业服务导航"
  defaultImage: /og-image.png
  keywords:
    - 宏翔商道
    - 企业导航
    - 企业服务导航
    - 企业内部系统
    - 政务服务
    - 知识产权
    - 企业信用
    - 人工智能
    - 公众平台

search:
  defaultEngine: bing
  enabledEngines:
    - bing
    - google
    - baidu
    - github
  showEngineSelector: true
  maxSuggestions: 5
  engines:
    - name: bing
      displayName: Bing
      baseUrl: https://www.bing.com/search
      queryParam: q
      icon: 🔍
      placeholder: 使用 Bing 搜索...
    - name: google
      displayName: Google
      baseUrl: https://www.google.com/search
      queryParam: q
      icon: 🌐
      placeholder: 使用 Google 搜索...
    - name: baidu
      displayName: 百度
      baseUrl: https://www.baidu.com/s
      queryParam: wd
      icon: 🐻
      placeholder: 使用百度搜索...
    - name: duckduckgo
      displayName: DuckDuckGo
      baseUrl: https://duckduckgo.com/
      queryParam: q
      icon: 🦆
      placeholder: 使用 DuckDuckGo 搜索...
    - name: github
      displayName: GitHub
      baseUrl: https://github.com/search
      queryParam: q
      icon: 🐙
      placeholder: 在 GitHub 中搜索...

